<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1560px;height:1170px;overflow:hidden;background:#0e1014}
.n{position:absolute;inset:0;background:
radial-gradient(29.2% 23.1% at 73.1% 22.3%, rgb(139 122 224 / 0.2), transparent 70%),
radial-gradient(23.1% 20% at 17.7% 59.2%, rgb(214 90 170 / 0.12), transparent 70%),
radial-gradient(26.2% 20% at 59.2% 85.4%, rgb(76 140 242 / 0.12), transparent 70%);}
svg{position:absolute;inset:0;width:100%;height:100%;opacity:.85;mix-blend-mode:screen;filter:blur(9px) saturate(1.9) brightness(1.2)}
</style></head><body><div class="n"></div>
      <svg preserveAspectRatio="none" viewBox="0 0 1000 1000">
        <defs>
          <filter id="neb-a" x="0" y="0" width="100%" height="100%">
            <feTurbulence type="fractalNoise" baseFrequency="0.0032 0.0045" numOctaves="5" seed="11" />
            <feColorMatrix
              type="matrix"
              values="0 0 0 0 0.43
                      0 0 0 0 0.33
                      0 0 0 0 0.86
                      0 0 0 2.6 -1.25"
            />
          </filter>
          <filter id="neb-b" x="0" y="0" width="100%" height="100%">
            <feTurbulence type="fractalNoise" baseFrequency="0.005 0.0035" numOctaves="4" seed="27" />
            <feColorMatrix
              type="matrix"
              values="0 0 0 0 0.86
                      0 0 0 0 0.36
                      0 0 0 0 0.66
                      0 0 0 2.4 -1.3"
            />
          </filter>
          <filter id="neb-c" x="0" y="0" width="100%" height="100%">
            <feTurbulence type="fractalNoise" baseFrequency="0.0045" numOctaves="4" seed="5" />
            <feColorMatrix
              type="matrix"
              values="0 0 0 0 0.3
                      0 0 0 0 0.55
                      0 0 0 0 0.95
                      0 0 0 2.2 -1.25"
            />
          </filter>
          <radialGradient id="neb-ma" cx="78%" cy="18%" r="55%">
            <stop offset="0" stop-color="#fff" />
            <stop offset="1" stop-color="#fff" stop-opacity="0" />
          </radialGradient>
          <radialGradient id="neb-mb" cx="15%" cy="62%" r="45%">
            <stop offset="0" stop-color="#fff" />
            <stop offset="1" stop-color="#fff" stop-opacity="0" />
          </radialGradient>
          <radialGradient id="neb-mc" cx="60%" cy="88%" r="40%">
            <stop offset="0" stop-color="#fff" />
            <stop offset="1" stop-color="#fff" stop-opacity="0" />
          </radialGradient>
          <mask id="neb-mask-a">
            <rect width="1000" height="1000" fill="url(#neb-ma)" />
          </mask>
          <mask id="neb-mask-b">
            <rect width="1000" height="1000" fill="url(#neb-mb)" />
          </mask>
          <mask id="neb-mask-c">
            <rect width="1000" height="1000" fill="url(#neb-mc)" />
          </mask>
        </defs>
        <rect width="1000" height="1000" filter="url(#neb-a)" mask="url(#neb-mask-a)" />
        <rect width="1000" height="1000" filter="url(#neb-b)" mask="url(#neb-mask-b)" opacity="0.75" />
        <rect width="1000" height="1000" filter="url(#neb-c)" mask="url(#neb-mask-c)" opacity="0.6" />
      </svg>
</body></html>
