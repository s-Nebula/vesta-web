<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Símbolo Vesta</title>
  <desc id="desc">Pin de ubicación geométrico con dos figuras familiares y un arco protector.</desc>
  <defs>
    <style>
      .wine{fill:#421827}.rose{fill:#C15B68}.ivory{fill:#F4EDEA}.beige{fill:#D6B7A6}
    </style>
  </defs>
  <!-- Pin exterior: silueta compacta, de lectura clara en tamaños pequeños -->
  <path class="wine" d="M256 34C143 34 58 119 58 229c0 139 150 240 198 279 48-39 198-140 198-279C454 119 369 34 256 34Z"/>
  <!-- Interior claro -->
  <path class="ivory" d="M256 78c-88 0-153 65-153 151 0 91 86 166 153 222 67-56 153-131 153-222 0-86-65-151-153-151Z"/>
  <!-- Figura adulta -->
  <circle class="wine" cx="211" cy="207" r="42"/>
  <path class="wine" d="M133 344c3-58 36-91 78-91s75 33 78 91c-25 22-51 43-78 66-27-23-53-44-78-66Z"/>
  <!-- Figura menor -->
  <circle class="rose" cx="309" cy="255" r="31"/>
  <path class="rose" d="M252 359c3-43 27-68 57-68s54 25 57 68c-18 17-37 32-57 48-20-16-39-31-57-48Z"/>
  <!-- Arco protector: trazo vectorial simple, sin efectos -->
  <path d="M91 326c58 73 214 78 323-12" fill="none" stroke="#C15B68" stroke-width="25" stroke-linecap="round"/>
  <path d="M105 345c74 54 204 55 291-10" fill="none" stroke="#F4EDEA" stroke-width="8" stroke-linecap="round"/>
</svg>
