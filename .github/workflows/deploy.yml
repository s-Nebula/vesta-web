# Compila el sitio y publica SOLO el resultado en la rama `deploy`.
#
# - main   = código fuente (nunca se sirve).
# - deploy = sitio compilado; cada publicación es un commit nuevo (historial
#            completo para volver a versiones anteriores). Nunca se reescribe.
#
# No usa secretos propios: publica con el GITHUB_TOKEN temporal que GitHub
# crea para cada ejecución, limitado a este repositorio.

name: Compilar y publicar

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Comprobar y compilar
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Comprobar tipos
        run: npm run typecheck

      - name: Compilar
        env:
          NEXT_PUBLIC_SITE_URL: https://vestasecurity.date
        run: npm run build

      - name: Verificar el resultado
        run: bash deploy/verify-build.sh out

      - name: Guardar el sitio compilado
        uses: actions/upload-artifact@v4
        with:
          name: sitio
          path: out
          retention-days: 30
          # Sin esto, upload-artifact@v4 omite las carpetas con punto (.well-known/security.txt).
          include-hidden-files: true

  publish:
    name: Publicar en la rama deploy
    needs: build
    # Solo desde main (nunca desde pull requests).
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: sitio
          path: ${{ runner.temp }}/sitio

      - name: Publicar
        env:
          SITE_DIR: ${{ runner.temp }}/sitio
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          WORK="$RUNNER_TEMP/deploy"
          if git ls-remote --exit-code --heads origin deploy >/dev/null; then
            git fetch origin deploy
            git worktree add "$WORK" origin/deploy
            git -C "$WORK" checkout -B deploy
          else
            git worktree add --detach "$WORK"
            git -C "$WORK" checkout --orphan deploy
          fi

          # Sustituir todo el contenido por el sitio nuevo.
          git -C "$WORK" rm -rfq --ignore-unmatch .
          cp -a "$SITE_DIR"/. "$WORK"/
          printf 'source_commit=%s\nbuilt_at=%s\nrun=%s/%s/actions/runs/%s\n' \
            "$SOURCE_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > "$WORK/BUILD_INFO.txt"

          git -C "$WORK" add -A
          if git -C "$WORK" diff --cached --quiet; then
            echo "Sin cambios en el sitio compilado; no se publica."
            exit 0
          fi
          git -C "$WORK" commit -q -m "Publicar ${SOURCE_SHA:0:7}" -m "Compilado desde ${SOURCE_SHA}"
          git -C "$WORK" push origin deploy
