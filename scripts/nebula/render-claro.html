<!-- Versión clara (2026-11-27): fondo blanco, nubes lila y un velo grafito tenue. -->
<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1560px;height:1170px;overflow:hidden;background:#ffffff}
.n{position:absolute;inset:0;background:
radial-gradient(34% 27% at 73.1% 22.3%, rgb(139 122 224 / 0.30), transparent 70%),
radial-gradient(26% 22% at 17.7% 59.2%, rgb(190 150 235 / 0.24), transparent 70%),
radial-gradient(28% 22% at 59.2% 85.4%, rgb(40 36 60 / 0.10), transparent 70%);}
svg{position:absolute;inset:0;width:100%;height:100%;opacity:.95;mix-blend-mode:multiply;filter:blur(8px) saturate(1.35)}
</style></head><body><div class="n"></div>
      <svg preserveAspectRatio="none" viewBox="0 0 1000 1000">
        <defs>
          <filter id="neb-a" x="0" y="0" width="100%" height="100%">
            <feTurbulence type="fractalNoise" baseFrequency="0.0032 0.0045" numOctaves="5" seed="11" />
            <feColorMatrix
              type="matrix"
              values="0 0 0 0 0.52
                      0 0 0 0 0.42
                      0 0 0 0 0.92
                      0 0 0 2.6 -1.25"
            />
          </filter>
          <filter id="neb-b" x="0" y="0" width="100%" height="100%">
            <feTurbulence type="fractalNoise" baseFrequency="0.005 0.0035" numOctaves="4" seed="27" />
            <feColorMatrix
              type="matrix"
              values="0 0 0 0 0.76
                      0 0 0 0 0.58
                      0 0 0 0 0.94
                      0 0 0 2.4 -1.3"
            />
          </filter>
          <filter id="neb-c" x="0" y="0" width="100%" height="100%">
            <feTurbulence type="fractalNoise" baseFrequency="0.0045" numOctaves="4" seed="5" />
            <feColorMatrix
              type="matrix"
              values="0 0 0 0 0.13
                      0 0 0 0 0.10
                      0 0 0 0 0.24
                      0 0 0 2.2 -1.25"
            />
          </filter>
          <radialGradient id="neb-ma" cx="78%" cy="18%" r="55%">
            <stop offset="0" stop-color="#fff" />
            <stop offset="1" stop-color="#fff" stop-opacity="0" />
          </radialGradient>
          <radialGradient id="neb-mb" cx="15%" cy="62%" r="45%">
            <stop offset="0" stop-color="#fff" />
            <stop offset="1" stop-color="#fff" stop-opacity="0" />
          </radialGradient>
          <radialGradient id="neb-mc" cx="60%" cy="88%" r="40%">
            <stop offset="0" stop-color="#fff" />
            <stop offset="1" stop-color="#fff" stop-opacity="0" />
          </radialGradient>
          <mask id="neb-mask-a">
            <rect width="1000" height="1000" fill="url(#neb-ma)" />
          </mask>
          <mask id="neb-mask-b">
            <rect width="1000" height="1000" fill="url(#neb-mb)" />
          </mask>
          <mask id="neb-mask-c">
            <rect width="1000" height="1000" fill="url(#neb-mc)" />
          </mask>
        </defs>
        <rect width="1000" height="1000" filter="url(#neb-a)" mask="url(#neb-mask-a)" />
        <rect width="1000" height="1000" filter="url(#neb-b)" mask="url(#neb-mask-b)" opacity="0.75" />
        <rect width="1000" height="1000" filter="url(#neb-c)" mask="url(#neb-mask-c)" opacity="0.32" />
      </svg>
</body></html>
